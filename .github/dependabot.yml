version: 2
updates:
  # Go. The module has no third-party dependencies, so this only tracks the
  # toolchain directive in go.mod — it should stay quiet, and a PR here is a
  # signal that something was added.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
